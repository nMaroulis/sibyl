services:
  sibyl:
    build:
      context: .
      args:
        SIBYL_EXTRAS: ${SIBYL_EXTRAS:-}
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      SIBYL_HOST: 0.0.0.0
      SIBYL_DATA_DIR: /data
    volumes:
      - sibyl-data:/data
    restart: unless-stopped
    init: true
volumes:
  sibyl-data:

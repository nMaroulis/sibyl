[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sibyl"
# Canonical version; use scripts/distribution/release.py set-version to synchronize mirrors and locks.
version = "2.4.0"
description = "A local-first crypto workspace with a React dashboard and ProtoLink agents."
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
  "anyio>=4,<5",
  "aiohttp>=3.10,<4",
  "fastapi>=0.115.12,<1",
  "uvicorn>=0.34,<1",
  "pydantic-settings>=2.8,<3",
  "cryptography>=45,<49",
  "httpx>=0.28,<1",
  "protolink[http]>=0.8.4,<0.9",
  "ccxt>=4.5,<5",
  "numpy>=2.2,<3",
  "scipy>=1.14,<2",
  "pandas>=2.2,<4",
  "vadersentiment>=3.3.2,<4",
  "tzdata>=2024.1",
  "pypdf>=6.21.4,<7",
  "psutil>=7.2,<8",
]

[project.optional-dependencies]
optimization = ["optuna>=4.9,<5"]
openai = ["openai>=2,<3"]
anthropic = ["anthropic>=0.54,<1"]
gemini = ["google-genai>=1.60,<2"]
huggingface = ["huggingface-hub>=1.3,<2"]
deepseek = ["openai>=2,<3"]
llama-cpp = ["llama-cpp-python>=0.3.30,<1"]
stocks = ["yfinance>=0.2.59,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.12,<1"]

[project.scripts]
sibyl = "sibyl.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sibyl"]

[tool.hatch.build.targets.sdist]
include = ["examples/strategy-plugin", "src/sibyl", "hatch_build.py", "pyproject.toml", "uv.lock", "README.md", "LICENSE"]

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.pytest.ini_options]
# Repository development helpers (scripts/) are imported by checkout tests.
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

name: Verify Sibyl
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: uv sync --frozen --group dev
      - run: uv run pytest
      - run: uv run ruff check src tests
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm run docs:build

name: Application CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Test, lint and build application
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: '3.12'
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked Python development dependencies
        run: uv sync --frozen --group dev --extra optimization
      - name: Run backend and agent tests
        run: uv run --extra optimization pytest
      - name: Lint Python code
        run: uv run ruff check src tests scripts/distribution hatch_build.py
      - name: Install locked JavaScript dependencies
        run: npm ci
      - name: Typecheck React dashboard
        run: npm run typecheck
      - name: Build React dashboard
        run: npm run build
      - name: Build Python wheel and source archive
        run: uv build
      - name: Validate bundled dashboard in wheel
        run: python scripts/distribution/release.py inspect-wheel dist/*.whl
      - name: Build and check documentation
        run: npm run docs:build
